name: MixologyHub CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package.json
          
      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci
        
      - name: Run Linter
        working-directory: ./backend
        run: npm run lint
        
      - name: Run Unit Tests
        working-directory: ./backend
        run: npm run test

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Run Vitest
        working-directory: ./frontend
        run: npm run test -- --watch=false