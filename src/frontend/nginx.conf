server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy all API calls to the backend container.
    # Browser page loads (Accept: text/html) fall through to the SPA.
    location ~ ^/(auth|cocktails|ingredients|bar-inventory|favorites|ai|admin|health|users|gdpr|api|uploads)(/|$) {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Routing Fallback — everything else serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
