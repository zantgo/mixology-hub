<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MixologyHub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="Discover cocktails you can make with ingredients you have at home.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.ico">
  <script>
    (function() {
      var theme = localStorage.getItem('mixologyhub-theme');
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else if (theme === 'system') {
        if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      }
      document.documentElement.classList.add('initial-load');
      window.addEventListener('load', function() {
        document.documentElement.classList.remove('initial-load');
      });
    })();
  </script>
  <style>
    .initial-load *,
    .initial-load *::before,
    .initial-load *::after {
      transition: none !important;
      animation: none !important;
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <app-root></app-root>
</body>
</html>
